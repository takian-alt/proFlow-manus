org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.lint.useK2Uast=false

# Kotlin daemon settings to prevent crashes
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC
kotlin.incremental=true
kotlin.daemon.useFallbackStrategy=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
